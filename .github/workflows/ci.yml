name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DUST_VERSION: v0.1.4
  DUST_LINUX_X64_SHA256: daa13df76f2370fa5a41fb092ed2e1c6942c51ce748fc617622374af61313b77
  FLUTTER_VERSION: 3.44.1

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Download the verified Dust CLI
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/dust-x86_64-unknown-linux-gnu.tar.gz"
          install_root="$RUNNER_TEMP/dust-cli"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/y3l1n4ung/dust/releases/download/$DUST_VERSION/dust-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$DUST_LINUX_X64_SHA256" "$archive" \
            | sha256sum --check --status -
          mkdir -p "$install_root/bin"
          tar -xzf "$archive" -C "$install_root/bin"
          chmod 0755 "$install_root/bin/dust"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          "$install_root/bin/dust" --version

      - name: Install the SQLx CLI
        run: |
          set -euo pipefail
          cargo install sqlx-cli --locked --version 0.8.6 \
            --no-default-features --features sqlite
          sqlx --version

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      # A clean checkout intentionally contains no .g.dart. Build every output
      # before analysis and tests, then prove the files remain generator-owned.
      - name: Regenerate Dust output
        run: ./scripts/generate.sh

      - name: Generated output policy is enforced
        run: |
          set -euo pipefail
          test -z "$(git ls-files -- '**/*.g.dart')"
          generated_count="$(find apps packages -type f -name '*.g.dart' \
            | wc -l | tr -d ' ')"
          test "$generated_count" -gt 0
          while IFS= read -r -d '' generated; do
            git check-ignore --no-index --quiet "$generated" || {
              echo "Generated Dart is not ignored: $generated" >&2
              exit 1
            }
          done < <(find apps packages -type f -name '*.g.dart' -print0)
          dust check --root packages/commerce_admin_shared
          dust check --root packages/commerce_shared
          dust check --root packages/commerce_server
          dust check --root apps/commerce_app
          dust check --root apps/admin_app
          dust check --db --root packages/commerce_server
          dust i18n check --root apps/commerce_app
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard -- \
            packages/commerce_admin_shared \
            packages/commerce_shared \
            packages/commerce_server \
            apps/commerce_app \
            apps/admin_app)"

      # Dust embeds ups for application startup. SQLx remains the operator tool
      # and must also prove that every reversible pair runs in both directions.
      - name: SQLx migrations run up and down
        run: |
          set -euo pipefail
          export DATABASE_URL="sqlite://$RUNNER_TEMP/reversible.db"
          sqlx database create
          sqlx migrate run --source packages/commerce_server/migrations
          for _migration in packages/commerce_server/migrations/*.down.sql; do
            sqlx migrate revert --source packages/commerce_server/migrations
          done
          remaining="$(sqlite3 "$RUNNER_TEMP/reversible.db" \
            "SELECT count(*) FROM sqlite_master WHERE type = 'table' \
             AND name != '_sqlx_migrations';")"
          test "$remaining" = "0"

      - name: Analyze
        run: |
          set -euo pipefail
          dart analyze packages/commerce_admin_shared
          dart analyze packages/commerce_shared
          dart analyze packages/commerce_server
          (cd apps/commerce_app && flutter analyze --no-pub)
          (cd apps/admin_app && flutter analyze --no-pub)

      # Handwritten Dart only. Formatting generated files rewrites them into
      # something the generator would not emit, and `dust check` above would
      # then report every one of them stale.
      - name: Format
        run: ./scripts/format.sh --check

      - name: Test
        run: |
          set -euo pipefail
          (cd packages/commerce_admin_shared && dart test)
          (cd packages/commerce_shared && dart test)
          (cd packages/commerce_server && dart test)
          (cd apps/commerce_app && flutter test --no-pub)
          (cd apps/admin_app && flutter test --no-pub)

      # The 180-line rule from CONTRIBUTING.md, enforced rather than trusted.
      # Generated files are exempt: they are output, not source.
      - name: File size budget
        run: ./scripts/check_file_size.sh

      # Handler, service and repository files are named for the operation they
      # serve and nothing else. A rule written down and never checked is a rule
      # that lasts until the first hurry.
      - name: Backend structure
        run: ./scripts/check_structure.sh
