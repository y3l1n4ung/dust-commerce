name: Delivery

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: delivery-main
  cancel-in-progress: true

env:
  DUST_VERSION: v0.1.4
  DUST_LINUX_X64_SHA256: daa13df76f2370fa5a41fb092ed2e1c6942c51ce748fc617622374af61313b77
  FLUTTER_VERSION: 3.44.1

jobs:
  package:
    name: Package release artifacts
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the verified revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Download the verified Dust CLI
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/dust-x86_64-unknown-linux-gnu.tar.gz"
          install_root="$RUNNER_TEMP/dust-cli"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/y3l1n4ung/dust/releases/download/$DUST_VERSION/dust-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$DUST_LINUX_X64_SHA256" "$archive" \
            | sha256sum --check --status -
          mkdir -p "$install_root/bin"
          tar -xzf "$archive" -C "$install_root/bin"
          chmod 0755 "$install_root/bin/dust"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          "$install_root/bin/dust" --version

      - name: Generate Dust output
        run: ./scripts/generate.sh

      - name: Validate the production API origin
        env:
          API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
        run: |
          set -euo pipefail
          case "$API_BASE_URL" in
            http://?*|https://?*) ;;
            *)
              echo "Set PRODUCTION_API_BASE_URL to an absolute HTTP(S) origin." >&2
              exit 1
              ;;
          esac

      - name: Build the Store and Admin web apps
        env:
          API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
        run: |
          set -euo pipefail
          (cd apps/commerce_app && flutter build web --release --no-pub \
            --dart-define=API_BASE_URL="$API_BASE_URL")
          (cd apps/admin_app && flutter build web --release --no-pub \
            --dart-define=API_BASE_URL="$API_BASE_URL")
          test -f apps/commerce_app/build/web/index.html
          test -f apps/admin_app/build/web/index.html

      - name: Build the Linux API bundle
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/dust-commerce-server"
          mkdir -p "$install_root"
          dart compile exe packages/commerce_server/bin/server.dart \
            -o "$install_root/dust-commerce-server"
          cp LICENSE README.md "$install_root/"
          cp -R packages/commerce_server/migrations "$install_root/"
          tar -czf "$RUNNER_TEMP/dust-commerce-server-linux-x64.tar.gz" \
            -C "$install_root" .

      - name: Upload the Store artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: morrow-store-${{ github.event.workflow_run.head_sha }}
          path: apps/commerce_app/build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Admin artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: morrow-admin-${{ github.event.workflow_run.head_sha }}
          path: apps/admin_app/build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload the API artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dust-commerce-server-linux-x64-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/dust-commerce-server-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
